[package]
name = "protocol-iot"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
bitflags = "2.10.0"
bitvec = "1.0.1"
bytes = "1.11.1"
futures = "0.3.31"
nom = "8.0.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
toml = "0.9.11"
